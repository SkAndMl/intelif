[project]
name = "vara"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1",
    "decision-index",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "huggingface_hub>=0.34",
    "safetensors>=0.4",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
intelif = "intelif.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
decision-index = { git = "https://github.com/apolinario/decision-index", rev = "87d4650b42b377c0291a89c1f1a879f9b31082bf" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intelif"]
